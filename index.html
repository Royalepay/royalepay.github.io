<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Royale Pay — Mock</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Bodoni+Moda:wght@600;700;900&family=Pinyon+Script&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0e0c;--bg2:#161412;--card:#1c1916;--card2:#23201c;--line:#2e2a25;
  --ink:#f3ecdc;--ink2:#b9ae9a;--ink3:#7d7466;
  --gold:#d4af37;--gold2:#b8902e;--gold3:#f1d27a;--red:#9b2335;--red2:#c23b4e;--green:#3f9a5e;--amber:#d0922e;
  --ivory:#f7f2e8;--shadow:0 18px 50px rgba(0,0,0,.45);
}
[data-theme="light"]{
  --bg:#f4efe4;--bg2:#ece5d6;--card:#fffdf8;--card2:#f6f0e3;--line:#e3dac7;
  --ink:#1c1813;--ink2:#5c5447;--ink3:#948a79;--shadow:0 18px 40px rgba(60,40,10,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top);overflow-x:hidden}
h1,h2,h3,.serif{font-family:"Cormorant Garamond",Georgia,serif}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font:inherit;color-scheme:dark}
[data-theme="light"] input{color-scheme:light}
a{color:var(--gold)}
.hide{display:none!important}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;background:var(--ivory);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;color:#1c1813;transition:opacity .8s}
#splash.out{opacity:0;pointer-events:none}
.mono{width:150px;height:150px;position:relative;display:flex;align-items:center;justify-content:center;animation:rise 1.2s cubic-bezier(.2,.8,.2,1) both}
.mono:before,.mono:after{content:"";position:absolute;inset:0;border:2px solid var(--gold2);border-radius:4px}
.mono:after{inset:8px;border-width:1px}
.mono img{width:62%;height:auto;display:block}
#splash .mono img{animation:floaty 4s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.mono span{display:none;font-family:"Cormorant Garamond",serif;font-size:96px;font-weight:700;color:#8a6a14;background:linear-gradient(135deg,#8a6a14,#d4af37 45%,#f1d27a 55%,#8a6a14);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;background-size:200% 200%;animation:shine 3s linear infinite}
#splash h1{margin-top:28px;font-family:"Bodoni Moda",serif;font-size:clamp(24px,8vw,50px);white-space:nowrap;text-align:center;letter-spacing:.2em;font-weight:700;padding-left:.26em;background:linear-gradient(100deg,#8a6a14,#d4af37 40%,#f1d27a 50%,#b8902e 60%,#8a6a14);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:rise 1.2s .3s both}
#splash p{letter-spacing:.3em;font-size:11px;text-transform:uppercase;color:#7a6c4a;margin-top:10px;animation:rise 1.2s .5s both}
#splash .cal{font-family:"Pinyon Script",cursive;font-size:clamp(30px,8vw,44px);color:#9b2335;margin-top:6px;animation:rise 1.2s .6s both}
#splash .panel{position:absolute;bottom:0;left:0;right:0;height:120px;background:#121212;border-radius:48px 48px 0 0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 28px;color:#cdbf9a;font-size:11px;letter-spacing:.12em;line-height:1.6;animation:up 1s .4s both}
#splash .bar{position:absolute;bottom:140px;width:160px;height:2px;background:#e9dfc6;overflow:hidden;border-radius:2px}
#splash .bar i{display:block;height:100%;width:0;background:var(--gold2);animation:load 2.6s .4s linear forwards}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes load{to{width:100%}}
@keyframes shine{to{background-position:200% 200%}}

/* ---------- login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 20px;background:radial-gradient(1200px 600px at 50% -10%,rgba(212,175,55,.18),transparent 60%),var(--bg)}
.lcard{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:36px 30px;box-shadow:var(--shadow);animation:rise .8s both}
.lcard .mono{width:84px;height:84px;margin:0 auto 18px}
.lcard .mono span{font-size:54px}
.lcard h1{text-align:center;font-family:"Bodoni Moda",serif;font-size:30px;letter-spacing:.22em;padding-left:.22em;font-weight:700;background:linear-gradient(100deg,#8a6a14,#d4af37 40%,#f1d27a 50%,#b8902e 60%,#8a6a14);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.lcard .sub{text-align:center;color:var(--ink3);font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin:6px 0 26px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--ink2);margin-bottom:6px;font-weight:600}
.field input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);outline:none}
.field input:focus{border-color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:14px;font-weight:700;font-size:14px;transition:transform .15s,box-shadow .2s;letter-spacing:.02em}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(135deg,#b8902e,#e2c35b 50%,#b8902e);color:#1c1813;box-shadow:0 10px 24px rgba(212,175,55,.25);width:100%}
.btn.red{background:linear-gradient(135deg,#8b1e2d,#c23b4e);color:#fff;box-shadow:0 10px 24px rgba(155,35,53,.35)}
.btn.ghost{border:1px solid var(--line);color:var(--ink2);background:var(--card2)}
.btn.sm{padding:8px 14px;font-size:12px;border-radius:10px}
.btn.green{background:linear-gradient(135deg,#2f7a49,#4bb06f);color:#fff}
.demo{margin-top:26px;border-top:1px dashed var(--line);padding-top:18px}
.demo p{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.18em;text-align:center;margin-bottom:12px}
.demo .roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.demo button{padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card2);text-align:left;transition:.2s}
.demo button:hover{border-color:var(--gold);transform:translateY(-2px)}
.demo b{display:block;font-size:14px}
.demo small{color:var(--ink3);font-size:11px}

/* ---------- shell ---------- */
#shell{display:none;min-height:100vh}
#shell.on{display:grid;grid-template-columns:250px 1fr}
aside{background:var(--bg2);border-right:1px solid var(--line);padding:26px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
aside .brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}
aside .brand .mono{width:44px;height:44px;animation:none}
aside .brand .mono span{font-size:28px}
aside .brand b{font-family:"Bodoni Moda",serif;font-size:17px;letter-spacing:.2em;font-weight:700;color:var(--gold);display:block;line-height:1}
aside .brand small{font-size:10px;color:var(--ink3);letter-spacing:.14em;text-transform:uppercase}
nav button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:12px;color:var(--ink2);font-weight:600;font-size:14px;margin-bottom:4px;transition:.2s}
nav button svg{width:18px;height:18px;flex:none}
nav button:hover{background:var(--card);color:var(--ink)}
nav button.on{background:linear-gradient(90deg,rgba(212,175,55,.18),transparent);color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
aside .me{margin-top:auto;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;gap:10px;align-items:center}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--gold));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:13px;flex:none}
aside .me b{font-size:13px;display:block}
aside .me small{font-size:11px;color:var(--ink3)}
main{padding:28px 32px 110px;max-width:1180px;width:100%}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.top h2{font-size:38px;font-weight:600;line-height:1}
.top .crumb{font-size:12px;color:var(--ink3);letter-spacing:.16em;text-transform:uppercase;margin-bottom:8px}
.top .right{display:flex;gap:10px;align-items:center}
.pill{padding:7px 12px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--card)}
.pill.gold{color:var(--gold);border-color:rgba(212,175,55,.4)}
.pill.green{color:#6fd092;border-color:rgba(63,154,94,.4)}
.pill.amber{color:#f0b35a;border-color:rgba(208,146,46,.45)}
.pill.red{color:#ff8a9a;border-color:rgba(194,59,78,.45)}
[data-theme="light"] .pill.green{color:#2f7a49}[data-theme="light"] .pill.amber{color:#a86d12}[data-theme="light"] .pill.red{color:#a52a3b}

.view{animation:fade .45s both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.card{min-width:0;max-width:100%}
.item .t{min-width:0}
.item .btn{flex:none}
main{overflow-x:hidden}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.12);position:relative;overflow:hidden}
.card.gold{border-color:rgba(212,175,55,.35);background:linear-gradient(160deg,rgba(212,175,55,.12),var(--card) 55%)}
.card h3{font-size:22px;font-weight:600;margin-bottom:6px}
.card .lbl{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.16em;font-weight:700}
.big{font-family:"Cormorant Garamond",serif;font-size:44px;font-weight:700;line-height:1.05;margin-top:6px}
.big.gold{color:var(--gold)}
.muted{color:var(--ink2);font-size:13px}
.tiny{color:var(--ink3);font-size:12px}
.row{display:flex;align-items:center;gap:12px}
.sb{justify-content:space-between}
.mt{margin-top:16px}.mb{margin-bottom:16px}

/* stepper */
.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:0;position:relative;margin:10px 0 6px}
.steps:before{content:"";position:absolute;top:17px;left:7%;right:7%;height:2px;background:var(--line)}
.step{text-align:center;position:relative;font-size:11px;color:var(--ink3);font-weight:600}
.stepnow{display:none;font-size:13px;color:var(--ink2);margin-top:4px}
.step i{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--card2);border:2px solid var(--line);margin:0 auto 8px;font-style:normal;font-size:12px;position:relative;transition:.4s}
.step.done i{background:var(--gold);border-color:var(--gold);color:#1c1813}
.step.now i{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 6px rgba(212,175,55,.15);animation:pulse 1.6s infinite}
.step.done,.step.now{color:var(--ink)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(212,175,55,.12)}50%{box-shadow:0 0 0 10px rgba(212,175,55,.05)}}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:rgba(212,175,55,.05)}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tbl .name b{display:block}.tbl .name small{color:var(--ink3)}
.up{color:#6fd092}.dn{color:#ff8a9a}
[data-theme="light"] .up{color:#2f7a49}[data-theme="light"] .dn{color:#a52a3b}
.flag{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;background:rgba(208,146,46,.15);color:#f0b35a}
.flag.red{background:rgba(194,59,78,.15);color:#ff8a9a}
.flag.green{background:rgba(63,154,94,.15);color:#6fd092}
.flag.gold{background:rgba(212,175,55,.15);color:var(--gold)}
.scroll{overflow:auto;max-height:520px;border-radius:14px;border:1px solid var(--line)}
.search{padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);width:260px;max-width:100%;outline:none}

/* attendance grid */
.att{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.att div{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--card2);border:1px solid var(--line)}
.att div small{font-size:9px;font-weight:600;color:var(--ink3)}
.att .P{background:rgba(63,154,94,.16);border-color:rgba(63,154,94,.4)}
.att .L{background:rgba(208,146,46,.16);border-color:rgba(208,146,46,.45)}
.att .A{background:rgba(194,59,78,.18);border-color:rgba(194,59,78,.5)}
.att .CL,.att .SL{background:rgba(212,175,55,.14);border-color:rgba(212,175,55,.45)}
.att .H,.att .S{opacity:.5}
.att .hd{aspect-ratio:auto;background:none;border:0;color:var(--ink3);font-size:10px;letter-spacing:.1em}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--ink2);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}

/* payslip */
.slip{background:var(--ivory);color:#1c1813;border-radius:18px;padding:28px;max-width:720px;box-shadow:var(--shadow);position:relative;font-size:13px}
.slip .head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #b8902e;padding-bottom:14px;margin-bottom:14px}
.slip .head .mono{width:56px;height:56px;animation:none}
.slip .head .row{gap:14px}
.slip .head .mono span{font-size:36px}
.slip .head h3{font-size:22px;color:#8a6a14;letter-spacing:.04em}
.slip .head small{display:block;color:#6d6252;font-size:11px}
.slip .meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;margin-bottom:14px}
.slip .meta div{display:flex;justify-content:space-between;border-bottom:1px dotted #d9ceb3;padding:4px 0}
.slip .meta span:first-child{color:#6d6252}
.slip .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.slip h4{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8a6a14;border-bottom:1px solid #b8902e;padding-bottom:6px;margin-bottom:6px}
.slip .ln{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dotted #e3d9c0}
.slip .ln.tot{font-weight:800;border-bottom:2px solid #1c1813;border-top:1px solid #1c1813;margin-top:6px}
.slip .net{margin-top:18px;background:#1c1813;color:#f1d27a;border-radius:14px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.slip .net b{font-family:"Cormorant Garamond",serif;font-size:34px}
.slip .net small{display:block;color:#cdbf9a;font-size:11px}
.slip .foot{margin-top:14px;font-size:10px;color:#8b7f68;text-align:center}
.slip .days{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0}
.slip .days div{background:#fff;border:1px solid #e3d9c0;border-radius:10px;padding:8px;text-align:center}
.slip .days b{display:block;font-size:18px;font-family:"Cormorant Garamond",serif}
.slip .days small{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#6d6252}
/* envelope */
.env{max-width:none;perspective:1200px;cursor:pointer}
.env .slip{max-width:none}
.envelope{position:relative;height:200px;background:linear-gradient(160deg,#2a2622,#1a1816);border:1px solid rgba(212,175,55,.35);border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:.6s}
.envelope:before{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(160deg,#3a342d,#24201c);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s cubic-bezier(.6,0,.2,1);border-bottom:1px solid rgba(212,175,55,.3)}
.envelope .seal{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d9566b,#7a1626);box-shadow:0 8px 20px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-family:"Cormorant Garamond",serif;font-weight:700;color:#f1d27a;font-size:30px;z-index:2;transition:.5s}
.envelope .hint{position:absolute;bottom:14px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3)}
.env.open .envelope:before{transform:rotateX(180deg)}
.env.open .seal{transform:scale(0);opacity:0}
.env .slip{margin-top:-30px;transform:translateY(-120px) scale(.9);opacity:0;transition:.9s .4s cubic-bezier(.2,.8,.2,1)}
.env.open .slip{transform:none;opacity:1}

/* approve */
.approve{max-width:640px;margin:0 auto;text-align:center}
.approve .big{font-size:64px}
.stamp{position:absolute;right:28px;top:28px;width:130px;height:130px;border:4px solid var(--red2);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--red2);font-family:"Cormorant Garamond",serif;font-weight:700;font-size:22px;letter-spacing:.1em;transform:rotate(-14deg) scale(3);opacity:0;pointer-events:none}
.stamp.in{animation:stamp .6s cubic-bezier(.2,1.2,.3,1) forwards}
@keyframes stamp{to{transform:rotate(-14deg) scale(1);opacity:.9}}
.sig{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:28px;color:var(--gold);display:inline-block;overflow:hidden;white-space:nowrap;width:0;border-right:2px solid var(--gold)}
.sig.go{animation:type 1.6s steps(24) forwards}
@keyframes type{to{width:100%;border-color:transparent}}

/* modal / toast */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;animation:fade .25s}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;max-width:560px;width:100%;box-shadow:var(--shadow);max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(30px);background:var(--card);border:1px solid rgba(212,175,55,.4);color:var(--ink);padding:14px 20px;border-radius:14px;box-shadow:var(--shadow);z-index:60;opacity:0;transition:.4s;font-weight:600;font-size:14px;display:flex;gap:10px;align-items:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast .ok{width:22px;height:22px;border-radius:50%;background:var(--green);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
pre.code{background:#0b0a09;color:#d8cfb8;padding:16px;border-radius:12px;font-size:12px;overflow:auto;max-height:260px;border:1px solid var(--line)}
[data-theme="light"] pre.code{background:#1c1813}
.progress{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold3));width:0;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;background:var(--card2);border:1px solid var(--line);transition:.3s}
.item.gone{opacity:0;transform:translateX(30px);height:0;padding:0;margin:0;overflow:hidden}
.item .t{flex:1}.item .t b{display:block;font-size:14px}.item .t small{color:var(--ink3);font-size:12px}
.sw{display:flex;gap:6px;background:var(--card2);padding:4px;border-radius:12px;border:1px solid var(--line)}
.sw button{padding:7px 12px;border-radius:9px;font-size:12px;font-weight:700;color:var(--ink3)}
.sw button.on{background:var(--card);color:var(--gold);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 16px;font-size:13px}
.kv span:nth-child(odd){color:var(--ink2)}
.kv span:nth-child(even){text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.ring{width:110px;height:110px;border-radius:50%;background:conic-gradient(var(--gold) var(--p),var(--line) 0);display:flex;align-items:center;justify-content:center;position:relative}
.ring:after{content:"";position:absolute;inset:10px;background:var(--card);border-radius:50%}
.ring b{position:relative;z-index:1;font-family:"Cormorant Garamond",serif;font-size:28px}
.conf{position:fixed;inset:0;pointer-events:none;z-index:70}
.conf i{position:absolute;top:-10px;width:8px;height:14px;border-radius:2px;animation:drop 2.4s ease-in forwards}
@keyframes drop{to{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* bottom tabs mobile */
.tabs{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:40;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{display:inline-flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:700;color:var(--ink3);padding:6px 2px;width:19.5vw;min-width:68px;vertical-align:top}
.tabs button svg{width:20px;height:20px}
.tabs button.on{color:var(--gold)}
@media(max-width:900px){
  #shell.on{grid-template-columns:1fr}
  aside{display:none}
  .tabs{display:block}
  main{padding:20px 16px 110px}
  .g2,.g3,.g4{grid-template-columns:1fr 1fr}
  .top h2{font-size:30px}
  .steps{grid-template-columns:repeat(7,1fr)}
  .step{font-size:9px}
  .slip{padding:18px}
  .slip .days{grid-template-columns:repeat(3,1fr)}
  .stamp{right:10px;top:10px;width:96px;height:96px;font-size:16px}
}
@media(max-width:600px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .grid.g4>.card,.grid.g3>.card{padding:16px 18px}
  .grid.g4{grid-template-columns:1fr 1fr}
  .grid.g4 .big{font-size:34px}
  .search{width:100%}
  .steps{grid-template-columns:repeat(7,1fr);margin:8px 0 4px}
  .steps:before{left:8%;right:8%}
  .step span{display:none}
  .step i{width:28px;height:28px;font-size:11px;margin-bottom:0}
  .stepnow{display:block}
  .big{font-size:36px}.big.gold{font-size:40px}
  .card{border-radius:16px}
  .card h3{font-size:20px}
  .kv{grid-template-columns:1fr auto;font-size:13px;gap:8px 12px}
  .item{padding:12px}
  .slip .meta,.slip .cols{grid-template-columns:1fr}
  .slip .net{flex-direction:column;align-items:flex-start;gap:8px}
  .slip .net div:last-child{text-align:left!important;max-width:none!important}
  .slip .head{flex-direction:column;align-items:flex-start;gap:10px}
  .slip .head>div:last-child{text-align:left!important}
  .approve .big{font-size:46px}
  .approve .grid.g3{grid-template-columns:repeat(3,1fr)}
  .top .right{width:100%}
  .btn.red,.btn.green{width:100%}
  .top{margin-bottom:18px}
  main{padding:18px 14px 120px}
  .envelope{height:170px}
  .ring{width:84px;height:84px}
  .modal .box{padding:20px}
  .card .grid.g2{grid-template-columns:1fr 1fr}
  .item{flex-wrap:wrap}
  .item .btn{width:100%;margin-top:4px}
  .att{gap:4px}
  .att div{font-size:12px;border-radius:8px}
  .att div small{display:none}
  .att div.CL small,.att div.SL small,.att div.H small,.att div.S small,.att div.A small{display:block;font-size:8px}
  .legend{gap:8px;font-size:10px}
  .row.sb{flex-wrap:wrap}
  .tbl th,.tbl td{padding:10px 8px;font-size:12px}
  .pill{font-size:11px;padding:6px 10px}
  .lcard{padding:28px 20px}
}
</style>
</head>

const MONTH={name:"October 2026",days:31,sundays:[4,11,18,25],holidays:[2,19,20,21],hol:{2:"Gandhi Jayanti",19:"Dasara",20:"Dasara",21:"Vijayadashami"}};

STAFF.forEach((s,idx)=>{
  let att=[],late=0,cl=0,sl=0,lop=0,present=0,missing=0;
  let joiner=s.joined==="12 Oct 2026";
  for(let d=1;d<=31;d++){

    else if(MONTH.holidays.includes(d)){o.k="H";}

    else{
      let r=rnd();
      if(idx===5&&(d===14||d===15)){o.k="CL";cl++}

      else if(idx===41&&d===27){o.k="A";lop++}
      else if(idx===88&&(d===6||d===7)){o.k="A";lop+=2}
      else if(r<0.035){o.k="CL";cl++}
      else if(r<0.055){o.k="SL";sl++}
      else{
        o.k="P";present++;
        let lateR=rnd();
        let inm= lateR<0.05? 41+Math.floor(rnd()*35) : 2+Math.floor(rnd()*36);
        o.in=t(8,inm);

        if((idx===23&&d===9)||(idx===63&&d===16)||(idx===104&&d===23)){o.out=null;missing++}
      }
    }

  }

  let lateHalf=Math.floor(late/3)*0.5;

function calc(s){
  let basic=Math.round(s.gross*0.5),hra=Math.round(s.gross*0.2),spl=s.gross-basic-hra;
  let f=s.paidDays/MONTH.days;
  let eb=Math.round(basic*f),eh=Math.round(hra*f),es=Math.round(spl*f);
  let earned=eb+eh+es;
  let lopAmt=s.gross-earned;
  let pf=Math.min(Math.round(eb*0.12),1800);
  let esi=s.gross<=21000?Math.ceil(earned*0.0075):0;
  let pt=earned>25000?200:0;
  // TDS new regime estimate
  let inc=s.gross*12-75000,tax=0;
  if(inc>1200000){const sl=[[400000,0],[800000,.05],[1200000,.10],[1600000,.15],[2000000,.20],[2400000,.25],[Infinity,.30]];let prev=0;for(const [lim,r] of sl){if(inc>prev){tax+= (Math.min(inc,lim)-prev)*r}prev=lim}tax*=1.04}
  let tds=Math.round(tax/12);
  let adv=s.advance||0;
  let ded=pf+esi+pt+tds+adv;
  let net=earned-ded;
  let last=s.increment?net-5400: s.lop>0? Math.round(net+lopAmt*0.9): s.joiner?0: net+ (s.id.endsWith("7")?0:Math.round((rnd()-.5)*0)) ;
  return {basic:eb,hra:eh,spl:es,earned,lopAmt,pf,esi,pt,tds,adv,ded,net,last};
}

VIEWS.admin.set=()=>hdr("Rules","Set once · used every month")+`<div class="grid g2"><div class="card"><h3>Attendance</h3><div class="kv mt"><span>In-time</span><span>8:30 am</span><span>Grace</span><span>10 min (till 8:40)</span><span>Late marks → half day</span><span>3</span><span>Half day if leaving before</span><span>12:30 pm</span><span>Working Saturdays</span><span>1st, 3rd, 5th (VI–XII staff)</span></div></div><div class="card"><h3>Leave</h3><div class="kv mt"><span>Casual leave / year</span><span>12</span><span>Sick leave / year</span><span>10</span><span>Carry forward</span><span>No</span><span>Leave year</span><span>June – May</span></div></div><div class="card"><h3>Salary</h3><div class="kv mt"><span>Salary date</span><span>1st of month</span><span>Salary month</span><span>Calendar days (30/31)</span><span>PF</span><span>12% of Basic, capped at ₹1,800</span><span>ESI</span><span>0.75% if gross ≤ ₹21,000</span><span>Professional Tax</span><span>₹200 if above ₹25,000</span><span>TDS</span><span>New regime unless staff chooses old</span></div></div><div class="card"><h3>Approval & mail</h3><div class="kv mt"><span>Checks</span><span>Accounts</span><span>Approves</span><span>Principal</span><span>Bank file</span><span>HDFC bulk NEFT (CSV)</span><span>Payslip email</span><span>After "Salary credited" only</span><span>Holidays 2026–27</span><span>14 set · <a href="#" onclick="toast('Holiday list (mock)');return false">view</a></span></div></div></div><p class="tiny mt">Changes here need IT Admin and are written to the change log.</p>`;
VIEWS.admin.log=()=>hdr("Change log","Who · what · when")+`<div class="card"><div class="list">${[...state.log.map(l=>({t:"Today "+l.t,who:l.who,what:l.what})),{t:"Today 3:10 pm",who:"Prasanth",what:"Added staff RC120 · Salma K. (Housekeeping)"},{t:"Yesterday 11:42 am",who:"Sunitha K.",what:"Increment for RC013 from October: ₹52,000 → ₹58,000"},{t:"28 Oct 10:05 am",who:"Sunitha K.",what:"Advance ₹9,000 to RC031 · recovery ₹3,000 × 3 months"},{t:"25 Oct 9:30 am",who:"Mrs. Rekha Vinod",what:"Approved September salary · ₹"+Math.round(TOTAL*0.985).toLocaleString("en-IN")},{t:"1 Oct 9:00 am",who:"Prasanth",what:"Holiday list updated · Dasara 19–21 Oct"}].map(l=>`<div class="item"><div class="avatar" style="background:var(--card);color:var(--gold);font-size:11px">${l.who.split(" ").map(x=>x[0]).join("").slice(0,2)}</div><div class="t"><b>${l.what}</b><small>${l.who} · ${l.t}</small></div></div>`).join("")}</div></div>`;

Object.assign(VIEWS.admin,Object.fromEntries(Object.entries(VIEWS.accounts).filter(([k])=>!VIEWS.admin[k])));
/* ================= ACTIONS ================= */
function fixPunch(id){state.fixed[id]=true;const el=document.getElementById("mp-"+id);el.classList.add("gone");log("Marked present · "+id+" (missing punch-out)");toast("Marked present · logged");setTimeout(()=>go('att'),500)}
function decide(id,ok){const l=state.leaves.find(x=>x.id===id);state.leaves=state.leaves.filter(x=>x.id!==id);document.getElementById("lv-"+id).classList.add("gone");log((ok?"Approved":"Declined")+" leave · "+l.who.name+" · "+l.days);toast((ok?"Approved · ":"Declined · ")+l.who.name+" informed by email");setTimeout(()=>go('leave'),500)}
function calcRun(){const pg=document.getElementById("pg");pg.classList.remove("hide");const i=pg.querySelector("i");i.style.width="100%";toast("Calculating 120 salaries…");setTimeout(()=>{state.month.calculated=true;state.month.attClosed=true;log("Calculated October salary · "+fmt(TOTAL));go('run')},1500)}
function sendApproval(){state.month.sent=true;log("Sent October salary to Principal");toast("Sent · Principal notified by email");go('run')}
function approve(){state.month.approved=true;document.getElementById("stamp").classList.add("in");log("Approved October salary · "+fmt(TOTAL));setTimeout(()=>{confetti();go('ok')},900)}
function bankFile(){state.month.bankMade=true;log("Made bank file · HDFC bulk NEFT · "+STAFF.length+" rows");const lines=PAY.map(p=>`NEFT,${p.s.acct},${p.s.ifsc},${p.s.name.toUpperCase()},${p.net}.00,RCIS SAL OCT26`).join("\n");modal(`<h3>Bank file ready</h3><p class="muted">HDFC bulk NEFT · ${STAFF.length} rows · total ${fmt(TOTAL)}. Upload this in net banking. The app never moves money itself.</p><pre class="code mt">${lines.split("\n").slice(0,8).join("\n")}\n… ${STAFF.length-8} more rows</pre><div class="row mt" style="gap:10px"><button class="btn gold" style="width:auto" onclick="navigator.clipboard&&navigator.clipboard.writeText(\`${lines.replace(/`/g,"")}\`).catch(()=>{});toast('Copied · paste into net banking upload');closeModal();go('run')">Copy file</button><button class="btn ghost" onclick="closeModal();go('run')">Close</button></div>`);}
function credited(){modal(`<h3>Salary credited?</h3><p class="muted">Confirm only after the bank shows the transfer done. Payslips will be emailed to all ${STAFF.length} staff and appear in their app.</p><div class="row mt" style="gap:10px"><button class="btn green" onclick="closeModal();state.month.credited=true;state.month.mailed=true;log('Marked salary credited · ${STAFF.length} payslips emailed');confetti();toast('Payslips emailed to ${STAFF.length} staff');go('run')">Yes, credited · send payslips</button><button class="btn ghost" onclick="closeModal()">Not yet</button></div>`)}
function showSlip(id){const p=PAY.find(x=>x.s.id===id);const m=modal(payslip(p,false)+`<button class="btn ghost sm mt" onclick="closeModal()">Close</button>`);m.querySelector(".box").style.maxWidth="780px"}
function showAtt(id){const s=STAFF.find(x=>x.id===id);const m=modal(`<h3>${s.name} · ${MONTH.name}</h3><p class="tiny mb">${s.id} · ${s.desig}</p>${attGrid(s)}<button class="btn ghost sm mt" onclick="closeModal()">Close</button>`);m.querySelector(".box").style.maxWidth="640px"}
function filterTbl(q,id){q=q.toLowerCase();document.querySelectorAll("#"+id+" tbody tr").forEach(r=>r.style.display=r.dataset.k.includes(q)?"":"none")}
function swRun(b,k){b.parentNode.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");document.querySelectorAll("#runTbl tbody tr").forEach(r=>r.style.display=(k==="all"||r.dataset.f==="1")?"":"none")}
function sendLeave(b){const card=b.closest(".card");const type=card.querySelector(".sw .on").textContent;const from=card.querySelectorAll("input[type=date]")[0].value,to=card.querySelectorAll("input[type=date]")[1].value;const f=d=>{const [y,m,dd]=d.split("-");return +dd+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m-1]};state.myLeaves.unshift({type:type==="Casual"?"CL":type==="Sick"?"SL":"Half day",days:from===to?f(from):f(from)+"–"+f(to),status:"Pending"});toast("Leave request sent to accounts");go("leave")}
function sw(b){b.parentNode.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on")}
</script>
